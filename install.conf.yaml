config:
  create: true
  workdir: ~/.config/dotdrop
  dotpath: .

dotfiles:
  tmux_conf:
    src: tmux.conf
    dst: ~/.tmux.conf
  vimrc:
    src: vimrc
    dst: ~/.vimrc
  emacs:
    src: emacs
    dst: ~/.emacs
  vim:
    dst: ~/.vim
    src: vim
  zshrc:
    dst: ~/.zshrc
    src: zshrc
  oh_my_zsh:
    dst: ~/.oh-my-zsh
    src: oh-my-zsh
  i3_config:
    dst: ~/.config/i3
    src: i3/
  i3status_config:
    dst: ~/.config/i3status
    src: i3status
  xdefaults:
    dst: ~/.Xdefaults
    src: Xdefaults
  xinitrc:
    dst: ~/.xinitrc
    src: xinitrc
  conkyrc:
    dst: ~/.conkyrc
    src: conkyrc
  gitconfig:
    dst: ~/.gitconfig
    src: gitconfig
  gitignore_global:
    dst: ~/.gitignore_global
    src: gitignore_global
  xmodmap:
    dst: ~/.xmodmap
    src: xmodmap
  zsh_funcs:
    dst: ~/.zsh_funcs
    src: zsh_funcs

profiles:
  tyr:
    dotfiles:
      - conkyrc
      - emacs
      - gitconfig
      - gitignore_global
      - i3_config
      - i3status_config
      - oh_my_zsh
      - tmux_conf
      - vim
      - vimrc
      - xdefaults
      - xinitrc
      - xmodmap
      - zsh_funcs
      - zshrc
